syntax = "proto3";

package tasktracker.v1;

option go_package = "highload-sis2/gen/tasktracker/v1;taskv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "tasktracker/v1/common.proto";

service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetInvitePreview(InviteTokenRequest) returns (GroupPreview);
  rpc JoinByInvite(InviteTokenRequest) returns (JoinResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty);
  rpc TransferOwnership(TransferOwnershipRequest) returns (Group);
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty);
  rpc CheckMembership(CheckMembershipRequest) returns (CheckMembershipResponse);
}

message CreateGroupRequest {
  string name = 1;
  int32 max_members = 2;
  int32 invite_max_uses = 3;
  int64 invite_ttl_seconds = 4;
}

message CreateGroupResponse {
  Group group = 1;
  string invite_url = 2;
  string invite_token = 3;
}

message InviteTokenRequest {
  string token = 1;
}

message GroupPreview {
  int64 group_id = 1;
  string name = 2;
  int32 member_count = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message JoinResponse {
  Group group = 1;
  bool already_member = 2;
}

message RemoveMemberRequest {
  int64 group_id = 1;
  int64 user_id = 2;
  bool ban = 3;
}

message TransferOwnershipRequest {
  int64 group_id = 1;
  int64 new_owner_id = 2;
}

message DeleteGroupRequest {
  int64 group_id = 1;
}

message CheckMembershipRequest {
  int64 group_id = 1;
  int64 user_id = 2;
}

message CheckMembershipResponse {
  bool is_member = 1;
  GroupRole role = 2;
  bool banned = 3;
}
