services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      # 55432 on the host: 5432 is often taken by a local PostgreSQL on developer machines.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  group-service:
    build:
      context: .
      args:
        SERVICE: group-service
    environment:
      GROUP_GRPC_ADDR: ":9091"
      FAULT_UNAVAILABLE_RATE: ${FAULT_UNAVAILABLE_RATE:-0}
      FAULT_DELAY_MS: ${FAULT_DELAY_MS:-0}
    ports:
      - "9091:9091"

  task-service:
    build:
      context: .
      args:
        SERVICE: task-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret}
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      PRIMARY_DSN: postgres://tasks:tasks@postgres:5432/tasks?sslmode=disable
      # MOCK: the "replica" is the same PostgreSQL container.
      REPLICA_DSN: postgres://tasks:tasks@postgres:5432/tasks?sslmode=disable
      REDIS_ADDR: redis:6379
      GROUP_SERVICE_ADDR: group-service:9091
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      group-service:
        condition: service_started

  k6:
    image: grafana/k6:2.3.0
    profiles: ["bench"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret}
    volumes:
      - ./bench/k6:/scripts:ro
      - ./proto:/proto:ro
      - ./bench/results:/results
